version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: typestorm-postgres
    environment:
      POSTGRES_DB: TypeStormDB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d TypeStormDB"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: typestorm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@typestorm.ru
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: